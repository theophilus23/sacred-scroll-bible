name: Build iOS Bible App (.ipa)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios-ipa:
    name: Build Unsigned iOS .ipa on macOS
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter (Stable)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate Xcode Runner Project & Preserve App Files
        run: |
          cp pubspec.yaml /tmp/pubspec.yaml.bak
          cp -R lib /tmp/lib_bak
          if [ -f ios/Runner/Info.plist ]; then
            cp ios/Runner/Info.plist /tmp/Info.plist.bak
          fi

          flutter create --platforms=ios --project-name sacred_scroll_bible --org com.sacredscroll.bible .

          cp /tmp/pubspec.yaml.bak pubspec.yaml
          rm -rf lib && cp -R /tmp/lib_bak lib
          if [ -f /tmp/Info.plist.bak ]; then
            cp /tmp/Info.plist.bak ios/Runner/Info.plist
          fi

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Configure Flutter iOS Release Build
        run: |
          flutter build ios --config-only --release --no-codesign

      - name: Compile Unsigned Runner.app via xcodebuild
        run: |
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/ios_derived \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package Runner.app into Installable .ipa Archive
        run: |
          mkdir -p build/ipa_payload/Payload
          cp -R build/ios_derived/Build/Products/Release-iphoneos/Runner.app build/ipa_payload/Payload/
          cd build/ipa_payload
          zip -qq -r -9 SacredScroll_Bible_iOS.ipa Payload
          ls -lh SacredScroll_Bible_iOS.ipa

      - name: Upload Downloadable .ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SacredScroll-Bible-iOS-IPA
          path: build/ipa_payload/SacredScroll_Bible_iOS.ipa
          if-no-files-found: error
          retention-days: 30